events {}

http {
    upstream auth { server styleme-auth:9001; }
    upstream booking { server styleme-booking:9001; }
    upstream payment { server styleme-payment:9003; }
    upstream reputation { server styleme-reputation:9001; }
    upstream frontend { server styleme-frontend:3000; }

    server {
        listen 80;
        server_name stylemeai.uz www.stylemeai.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name stylemeai.uz www.stylemeai.uz;

        ssl_certificate /etc/letsencrypt/live/stylemeai.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stylemeai.uz/privkey.pem;

        location /api/v1/auth/ { proxy_pass http://auth; proxy_set_header Host $host; }
        location /api/v1/admin/ { proxy_pass http://auth; proxy_set_header Host $host; }
        location /api/v1/analytics/ { proxy_pass http://auth; proxy_set_header Host $host; }
        location /api/v1/bookings/ { proxy_pass http://booking; proxy_set_header Host $host; }
        location /api/v1/barbers/ { proxy_pass http://booking; proxy_set_header Host $host; }
        location /api/v1/payments/ { proxy_pass http://payment; proxy_set_header Host $host; }
        location /api/v1/reputation/ { proxy_pass http://reputation; proxy_set_header Host $host; }
        
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
