version: '3.8'

services:
  postgres:
    image: docker.m.daocloud.io/postgis/postgis:15-3.3
    container_name: styleme-postgres
    environment:
      POSTGRES_USER: styleme_user
      POSTGRES_PASSWORD: styleme_password
      POSTGRES_DB: styleme_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mongodb:
    image: docker.m.daocloud.io/library/mongo:6.0
    container_name: styleme-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: always

  redis:
    image: docker.m.daocloud.io/library/redis:7.0-alpine
    container_name: styleme-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always



  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    container_name: styleme-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    container_name: styleme-grafana
    ports:
      - "3001:3000"
    restart: always

volumes:
  pgdata:
  mongodata:
  redisdata:
