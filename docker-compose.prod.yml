version: '3.8'

services:
  postgres:
    image: docker.m.daocloud.io/postgis/postgis:15-3.3
    container_name: styleme-postgres
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mongodb:
    image: docker.m.daocloud.io/library/mongo:4.4
    container_name: styleme-mongodb
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
    volumes:
      - mongodata:/data/db
    restart: always

  redis:
    image: docker.m.daocloud.io/library/redis:7.0-alpine
    container_name: styleme-redis
    volumes:
      - redisdata:/data
    restart: always

  auth-service:
    build: 
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: styleme-auth
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
    restart: always
    depends_on:
      - postgres
      - redis

  booking-service:
    build: 
      context: .
      dockerfile: ./services/booking-service/Dockerfile
    container_name: styleme-booking
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
      - PORT=9002
    restart: always
    depends_on:
      - postgres

  payment-service:
    build: 
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: styleme-payment
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
      - PORT=9003
    restart: always
    depends_on:
      - postgres
      - redis

  reputation-service:
    build: 
      context: .
      dockerfile: ./services/reputation-service/Dockerfile
    container_name: styleme-reputation
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
      - PORT=9004
    restart: always

  ai-service:
    build: ./services/ai-service
    container_name: styleme-ai
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
    volumes:
      - aimodels:/root/.insightface
      - aimodels:/app/models
      - ./services/ai-service/uploads:/app/uploads
    restart: always
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]

  frontend:
    build: ./services/frontend
    container_name: styleme-frontend
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=styleme_db_pass_123
    restart: always

  nginx:
    image: nginx:alpine
    container_name: styleme-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - auth-service
      - booking-service
      - payment-service
      - reputation-service
      - ai-service
    restart: always

  certbot:
    image: certbot/certbot
    container_name: styleme-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  mongodata:
  redisdata:
  aimodels:
